<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Nexus Dashboard · Inicio Rápido</title>
    <!--<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">-->
    <link rel="shorcut icon" size="16x16 24x24 32x32 48x48" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
	<!-- Elemento de fondo fijo (parallax puro) -->
    <div class="fixed-bg" id="fixedBackground"></div>
    <div class="overlay-bg" id="overlayBackground"></div>

    <div class="dashboard">
        <div class="top-bar">
            <div class="datetime-temp">
                <div class="clock" id="clockDisplay">--:--:--</div>
                <div class="weather" id="weatherWidget">
                    <i class="fas fa-cloud-sun"></i> <span id="tempText">-- °C</span>
                </div>
            </div>
            <div class="custom-controls">
                <button class="ctrl-btn" id="toggleCustomizeBtn"><i class="fas fa-palette"></i> Personalizar</button>
                <button class="ctrl-btn reset-data-btn" id="resetDataBtn"><i class="fas fa-undo-alt"></i> Reiniciar Accesos</button>
            </div>
        </div>

        <div id="customizePanel" style="display: none;">
            <div class="customize-panel">
                <div class="color-row">
                    <label for="fontColorPicker"><i class="fas fa-font"></i> Color texto:</label>
                    <input type="color" id="fontColorPicker" value="#f0f3fa">
                    <button class="ctrl-btn" id="applyFontColor" style="background:#3a3a5e;">Aplicar</button>
                </div>
                <div class="bg-row">
                    <label for="bgUrlInput"><i class="fas fa-image"></i> Fondo URL:</label>
                    <input type="text" id="bgUrlInput" placeholder="https://...jpg .png .webp" class="bg-url-input">
                    <button class="ctrl-btn" id="setBgUrlBtn">Cargar URL</button>
                    <label for="bgFileInput" class="file-label"><i class="fas fa-upload"></i> Imagen local</label>
                    <input type="file" id="bgFileInput" accept="image/*" style="display: none;">
                    <button class="ctrl-btn" id="resetBgBtn">Fondo por defecto</button>
                </div>
            </div>
        </div>

        <div id="shortcutsContainer" class="shortcuts-grid"></div>

        <div class="add-form">
            <input type="text" id="newShortcutTitle" placeholder="Nombre (Ej: Youtube)" autocomplete="off">
            <input type="text" id="newShortcutUrl" placeholder="https:// o dominio.com" autocomplete="off">
            <button id="addShortcutBtn"><i class="fas fa-plus"></i> Añadir acceso</button>
        </div>
        <p style="font-size: 0.7rem; text-align: center; margin-top: 1.2rem; opacity: 0.7;">🖱️ Arrastra para reordenar</p>
    </div>
    <div id="toastMsg" class="toast-msg"></div>
    <script src="main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="X-UA-Compatible" content="ie=edge">
	<title>Nexus Dashboard · Inicio Rápido</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
	<div class="dashboard">
    <div class="top-bar">
        <div class="datetime-temp">
            <div class="clock" id="clockDisplay">--:--:--</div>
            <div class="weather" id="weatherWidget">
                <i class="fas fa-cloud-sun"></i> <span id="tempText">-- °C</span>
            </div>
        </div>
        <div class="custom-controls">
            <button class="ctrl-btn" id="toggleCustomizeBtn" aria-label="Personalizar apariencia"><i class="fas fa-palette"></i> Personalizar</button>
            <button class="ctrl-btn reset-data-btn" id="resetDataBtn" aria-label="Restablecer accesos directos"><i class="fas fa-undo-alt"></i> Reiniciar Accesos</button>
        </div>
    </div>

    <!-- Nueva sección de Exportar/Importar JSON -->
    <div class="import-export-bar">
        <div class="import-export-buttons">
            <button class="ctrl-btn" id="exportJsonBtn" style="background: #0984e3;"><i class="fas fa-download"></i> Exportar </button>
            <label for="importJsonFile" class="file-input-label" style="background: #00b894;">
                <i class="fas fa-upload"></i> Importar
            </label>
            <input type="file" id="importJsonFile" accept=".json" style="display: none;">
            <button class="ctrl-btn" id="mergeJsonBtn" style="background: #e17055;"><i class="fas fa-layer-group"></i> Fusionar </button>
        </div>
        <div class="import-status" id="importStatus">
            <i class="fas fa-info-circle"></i> Exporta tus accesos como respaldo
        </div>
    </div>

    <div id="customizePanel" style="display: none;">
        <div class="customize-panel">
            <div class="color-row">
                <label for="fontColorPicker">
                    <i class="fas fa-font"></i> Color texto:
                </label>
                <input type="color" id="fontColorPicker" value="#f0f3fa" aria-label="Selector de color para el texto">
                <button class="ctrl-btn" id="applyFontColor" style="background:#3a3a5e;">Aplicar</button>
            </div>
            <div class="bg-row">
                <label for="bgUrlInput">
                    <i class="fas fa-image"></i> Fondo URL:
                </label>
                <input type="text" id="bgUrlInput" placeholder="URL de imagen (JPG, PNG, WEBP, GIF)" class="bg-url-input" aria-label="URL de imagen de fondo">
                <button class="ctrl-btn" id="setBgUrlBtn">Cargar URL</button>
                <label for="bgFileInput" class="file-label" tabindex="0">
                    <i class="fas fa-upload"></i> Imagen local
                </label>
                <input type="file" id="bgFileInput" accept="image/*" style="display: none;" aria-label="Subir imagen local como fondo">
                <button class="ctrl-btn" id="resetBgBtn">Fondo por defecto</button>
            </div>
        </div>
        <div class="customize-panel" style="margin-top: -1rem; justify-content: space-between; flex-wrap: wrap;">
            <span class="pinterest-hint"><i class="fab fa-pinterest"></i> <strong>Pinterest:</strong> 1⃣ Abre la imagen 2⃣ Clic derecho → "Abrir imagen en nueva pestaña" 3⃣ Copia esa URL</span>
            <span class="bg-preview" id="bgPreviewStatus">✅ Soporta: Imgur, Flickr, cualquier URL directa de imagen</span>
        </div>
    </div>

    <div id="shortcutsContainer" class="shortcuts-grid"></div>

    <div class="add-form">
        <input type="text" id="newShortcutTitle" placeholder="Nombre (Ej: Youtube)" autocomplete="off" aria-label="Título del nuevo acceso">
        <input type="text" id="newShortcutUrl" placeholder="https:// o dominio.com" autocomplete="off" aria-label="URL del sitio web">
        <button id="addShortcutBtn" aria-label="Añadir nuevo acceso"><i class="fas fa-plus"></i> Añadir acceso</button>
    </div>
    <p style="font-size: 0.7rem; text-align: center; margin-top: 1.2rem; opacity: 0.7;">🖱️ Arrastra para reordenar · El ícono es el favicon real del sitio web</p>
</div>
<div id="toastMsg" class="toast-msg" role="status" aria-live="polite"></div>
<script src="main.js"></script>
</body>
</html>
